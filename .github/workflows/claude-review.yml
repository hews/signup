# Automatic review of every pull request by Claude, against AGENTS.md.
# Needs the Claude GitHub App installed on the repository and the secret
# CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) set in repository secrets.
name: claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first; each invariant there is a blocking
            finding if the change violates it. Then check correctness, tests, and anything a
            careful maintainer would not merge. Report findings most severe first with file and
            line. Say plainly if there is nothing to report. Do not restate the diff or praise it.

            Post the review to the pull request: one top-level comment with `gh pr comment`, and
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
            findings tied to a line. Only GitHub comments reach anyone; text left in this
            session is lost.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
